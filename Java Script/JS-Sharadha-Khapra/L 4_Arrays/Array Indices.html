<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays</title>
</head>
<body>
    <p>Arrays in JS</p>
    <script>
        let marks = [84,92,64,88,99,100];
        console.log(marks);
        console.log(marks[0]);
        console.log(marks[2]);
        console.log(marks[5]);

        // String ma hum value change nhi kar skata
        // Arrays ma hum value change kar skta han
        // like This 👇
        console.log("Now we will change the value in Arrays marks 2");
        marks[2] = 44;
        console.log(marks[2]);
    </script>
</body>
