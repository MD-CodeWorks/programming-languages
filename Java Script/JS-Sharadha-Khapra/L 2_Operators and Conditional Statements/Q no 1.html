<body>
    <script>
        // Q no 1: Get user to input a number using prompt ("Enter a number:"). Check if the number is a multiple of 5 or not.

        // Video Time: 
        
        let num = prompt("Enter a number: ");

        if (num % 5 == 0){
            console.log(num, " is a multiple of 5.")
        }else console.log("This is not multiple of 5.")

    </script>
</body>
