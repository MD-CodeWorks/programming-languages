<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String</title>
</head>

<body>
    <h1>String is a sequence of characters used to represent text</h1>
    <div>
        <ol>
            <li>Create String</li>
            <p>let str = "Muhammad Dilawar";</p>
            <li>String Length</li>
            <p>str.length</p>
            <li>String Indices</li>
            <p>str[0], str[1], str[2]</p>
        </ol>
    </div>


    <script>
        // String
        let str = "Muhammad Dilawar";
        console.log(str);
        console.log(str.length);
        console.log(str[3]);
    </script>
</body>

</html>
