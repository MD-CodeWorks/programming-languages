<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for in loop</title>
</head>
<body>
    <script>
        // Video Time: 31:30
        // This loop for object

        let student = {
            name: "Muhammad Dilawar",
            age: 19,
            cgpa: 4.00,
            isPass: true,
        };

        for(let key in student){
            console.log("key = ", key, "value = ", student[key]);
        }
    </script>
</body>
</html>
