<body>
    <p>Q1. Create a function using the "function" keyword that takes a String as an argument & returns the number of
        vowels in the string.</p>
    <br>
    <br>
    <p>Q. Create an arrow function to perform the same task.</p>

    <script>
        function countVowels(str) {
            let count = 0;
            for (const char of str) {
                if (char === "a" || char === "e" || char === "i" || char === "o" || char === "u") {
                    count++;
                }
            }
            console.log(count);
        }
        console.log(countVowels("Muhammad Dilawar"));
        // console.log(countVowels);
    </script>
