    <script>
        // Qs. For a given array of numbers, print the square of each value using the forEach loop.

        let nums = [1,3,2,4,5,4,6];

        let calcSquare = (num) => {
            console.log(num*num);
        }
    
        nums.forEach(calcSquare)
    </script>
