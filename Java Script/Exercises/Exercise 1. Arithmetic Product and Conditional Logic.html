    <!--

        Exercise 1. Arithmetic Product and Conditional Logic

        Practice Problem: Write a JavaScript function that accepts two numbers as arguments. If the product of the two numbers is less than or equal to 1000, return their product; otherwise, return their sum.

        Exercise Purpose: Learn basic control flow and the use of if-else statements in JavaScript. Understand how code decisions change output based on a mathematical threshold.

        Given Input:
        Case 1: number1 = 20, number2 = 30
        Case 2: number1 = 40, number2 = 30
        
        Expected Output:
        The result is 600
        The result is 70
    -->
    <script>
        function Product(number1, number2) {
            let result = number1 * number2;
            if (Product <= 1000) {
                return result;
            }
            else return number1 + number2;
        }
        console.log("The result is ", Product(20, 30));
        console.log("The result is ", Product(40, 30));
    </script>
</body>
